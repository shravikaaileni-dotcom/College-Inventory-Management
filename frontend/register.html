
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusStock</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-info">
            <a href="index.html" class="back-home">← Back to Home</a>
            <div class="auth-brand">
                <span class="logo-icon">C</span>
                <h2>CampusStock</h2>
            </div>

            <h1>Join CampusStock</h1>
            <p>Create your account to access the College Inventory Management System.</p>

            <div class="auth-benefits">
                <p>✓ Manage your inventory activities</p>
                <p>✓ Track assigned items</p>
                <p>✓ Access role-based features</p>
            </div>
        </div>

        <div class="auth-form-section">
            <div class="auth-form">
                <h2>Create Account</h2>
                <p class="form-subtitle">Fill in your details to register.</p>

                <form id="registerForm">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required>

                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>

                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" minlength="8" required>

                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

                    <label for="registerRole">Register As</label>
                    <select id="registerRole" required>
                        <option value="">Select your role</option>
                        <option value="faculty">Faculty / Lab Assistant</option>
                        <option value="student">Student</option>
                    </select>

                    <button type="submit" class="auth-button">Create Account →</button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
